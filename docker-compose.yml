version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=spot_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=spot_me
      - SECRET_KEY=${SECRET_KEY}
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      - db
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    container_name: spot_me_worker
    volumes:
      - ./backend:/app
    restart: always
    depends_on:
      - db
      - temporal
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=spot_me
      - TEMPORAL_HOST=temporal:7233
    command: python -u -m src.worker.main

  # 2. Temporal UI (The Dashboard)
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: spot_me_temporal_ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    ports:
      - "8080:8080"
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: spot_me_temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=db
    depends_on:
      - db
    ports:
      - "7233:7233" # gRPC Port (For Python Code)
      - "8233:8233" # HTTP Port (For Temporal UI)

volumes:
  postgres_data:
